services:
  db:
    image: mysql:8.4
    container_name: shopsmart-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopsmart}
      MYSQL_USER: ${MYSQL_USER:-shopsmart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopsmartpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: shopsmart-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-5001}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      DB_MIGRATION_MAX_ATTEMPTS: ${DB_MIGRATION_MAX_ATTEMPTS:-20}
      DATABASE_URL: mysql://${MYSQL_USER:-shopsmart}:${MYSQL_PASSWORD:-shopsmartpass}@db:3306/${MYSQL_DATABASE:-shopsmart}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5001}:5001"

volumes:
  mysql_data:
